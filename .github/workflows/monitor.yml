name: Monitor IBS/CBS

on:
  schedule:
    - cron: "0 8 * * 1-5"
  workflow_dispatch:
    inputs:
      forcar_email:
        description: "Forcar envio de e-mail mesmo sem normas novas?"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monitorar:
    name: Executar agente de monitoramento
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Restaurar banco de dados (cache)
        uses: actions/cache@v4.2.2
        with:
          path: data/ibs_cbs.db
          key: ibs-cbs-db-${{ github.run_number }}
          restore-keys: |
            ibs-cbs-db-

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Executar Monitor IBS/CBS
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST:         smtp.gmail.com
          SMTP_PORT:         587
          SMTP_USER:         ${{ secrets.SMTP_USER }}
          SMTP_PASS:         ${{ secrets.SMTP_PASS }}
          EMAIL_DESTINO:     ${{ secrets.EMAIL_DESTINO }}
          EMAIL_FROM:        ${{ secrets.SMTP_USER }}
          FORCAR_EMAIL:      ${{ inputs.forcar_email || 'false' }}
        run: python src/agent.py

      - name: Upload de artefatos
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ibs-cbs-run-${{ github.run_number }}
          path: data/ibs_cbs.db
          retention-days: 30
